services:
  lgu-app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: lgu-resource-planning-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  lgu-app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lgu-resource-planning-prod
    ports:
      - "8080:80"
    profiles: ["prod"]